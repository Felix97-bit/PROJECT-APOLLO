<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Apollo</title>

  <!-- Google Fonts: Cinzel (the elegant serif wordmark) + Inter (clean UI text) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@400;500;600&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <!-- Hidden SVG filter that frays the page's edges into a ripped, tattered
       edge (used by .stage::before in styles.css). Not visible itself. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <filter id="torn-edge">
      <feTurbulence type="fractalNoise" baseFrequency="0.014 0.016"
                    numOctaves="4" seed="8" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="20"
                         xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </svg>

  <!-- The full-window stage: a torn old-book page on a dark surface -->
  <main class="stage">

    <!-- ============ CENTERPIECE: the golden compass ============ -->
    <section class="center" aria-label="Apollo">
      <div class="compass-wrap">
        <!-- Speaking-state "living energy": an orbiting energy ring + drifting
             light wisps. All sit BEHIND the compass and only animate when the
             .speaking class is on .compass-wrap (driven by the TTS events). -->
        <div class="glow-layers" aria-hidden="true">
          <!-- .glow-inner flickers the overall intensity; inside: an even base
               halo, a rotating conic sweep, and 5 wisps that ORBIT the centre
               at non-synced speeds for even, never-repeating energy. -->
          <div class="glow-inner">
            <div class="halo-base"></div>
            <div class="sweep"></div>
            <div class="orbit orbit-1"><span class="blob"></span></div>
            <div class="orbit orbit-2"><span class="blob"></span></div>
            <div class="orbit orbit-3"><span class="blob"></span></div>
            <div class="orbit orbit-4"><span class="blob"></span></div>
            <div class="orbit orbit-5"><span class="blob"></span></div>
          </div>
        </div>

        <!-- The core halo (glows when Apollo speaks) sits behind the compass -->
        <div class="halo" id="halo" aria-hidden="true"></div>

        <!-- Original ornate nautical compass, built as a scalable SVG.
             The repetitive decorative rings (beads, ticks, filigree) are
             generated by app.js into the empty <g> groups below. -->
        <svg class="compass" id="compass" viewBox="0 0 400 400" role="img"
             aria-label="Golden compass">
          <defs>
            <!-- Soft warm backing behind the rose -->
            <radialGradient id="faceGrad" cx="50%" cy="45%" r="60%">
              <stop offset="0%" stop-color="#FFFFFF" />
              <stop offset="70%" stop-color="#FCF7EA" />
              <stop offset="100%" stop-color="#F3EEE2" />
            </radialGradient>
            <!-- Light facet of each compass point -->
            <linearGradient id="pointLight" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#F8ECC4" />
              <stop offset="100%" stop-color="#D4AF37" />
            </linearGradient>
            <!-- Dark facet of each compass point (the shadowed half) -->
            <linearGradient id="pointDark" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#B8902E" />
              <stop offset="100%" stop-color="#9C7A1E" />
            </linearGradient>
            <!-- Polished center jewel -->
            <radialGradient id="jewelGrad" cx="40%" cy="35%" r="70%">
              <stop offset="0%" stop-color="#FFF6D8" />
              <stop offset="45%" stop-color="#F4E5B8" />
              <stop offset="100%" stop-color="#9C7A1E" />
            </radialGradient>
          </defs>

          <!-- Warm circular face -->
          <circle cx="200" cy="200" r="194" fill="url(#faceGrad)" />

          <!-- Two fine concentric rings -->
          <circle cx="200" cy="200" r="194" fill="none" stroke="#D4AF37"
                  stroke-width="2" opacity="0.9" />
          <circle cx="200" cy="200" r="186" fill="none" stroke="#B8902E"
                  stroke-width="1" opacity="0.6" />
          <circle cx="200" cy="200" r="164" fill="none" stroke="#D4AF37"
                  stroke-width="1.4" opacity="0.8" />

          <!-- Decorative groups generated by app.js -->
          <g id="filigree"  opacity="0.45"></g>  <!-- radial mandala backing -->
          <g id="tickRing"></g>                  <!-- fine tick marks -->
          <g id="beadRing"></g>                  <!-- ring of small dots -->

          <!-- ===== The compass rose ===== -->
          <!-- This whole group rotates slowly when Apollo is speaking -->
          <g id="rose">
            <!-- Diagonal points (NE, SE, SW, NW) — drawn first, behind cardinals -->
            <g class="rose-diagonals">
              <!-- NE -->
              <polygon points="282,118 229,187 200,200" fill="url(#pointLight)" />
              <polygon points="282,118 213,171 200,200" fill="url(#pointDark)" />
              <!-- SE -->
              <polygon points="282,282 213,229 200,200" fill="url(#pointLight)" />
              <polygon points="282,282 229,213 200,200" fill="url(#pointDark)" />
              <!-- SW -->
              <polygon points="118,282 171,213 200,200" fill="url(#pointLight)" />
              <polygon points="118,282 187,229 200,200" fill="url(#pointDark)" />
              <!-- NW -->
              <polygon points="118,118 187,171 200,200" fill="url(#pointLight)" />
              <polygon points="118,118 171,187 200,200" fill="url(#pointDark)" />
            </g>

            <!-- Cardinal points (N, E, S, W) — longer and prominent -->
            <g class="rose-cardinals">
              <!-- North (slightly elaborated tip) -->
              <polygon points="200,40 184,160 200,200" fill="url(#pointLight)" />
              <polygon points="200,40 216,160 200,200" fill="url(#pointDark)" />
              <!-- East -->
              <polygon points="360,200 240,184 200,200" fill="url(#pointLight)" />
              <polygon points="360,200 240,216 200,200" fill="url(#pointDark)" />
              <!-- South -->
              <polygon points="200,360 216,240 200,200" fill="url(#pointLight)" />
              <polygon points="200,360 184,240 200,200" fill="url(#pointDark)" />
              <!-- West -->
              <polygon points="40,200 160,216 200,200" fill="url(#pointLight)" />
              <polygon points="40,200 160,184 200,200" fill="url(#pointDark)" />
            </g>
          </g>

          <!-- Cardinal letter medallions on the ring (static, don't rotate) -->
          <g class="medallions" font-family="Cinzel, serif" font-weight="600">
            <g>
              <circle cx="200" cy="22" r="15" fill="#FCF7EA" stroke="#D4AF37" stroke-width="1.5" />
              <text x="200" y="27" text-anchor="middle" font-size="15" fill="#9C7A1E">N</text>
            </g>
            <g>
              <circle cx="378" cy="200" r="15" fill="#FCF7EA" stroke="#D4AF37" stroke-width="1.5" />
              <text x="378" y="205" text-anchor="middle" font-size="15" fill="#9C7A1E">E</text>
            </g>
            <g>
              <circle cx="200" cy="378" r="15" fill="#FCF7EA" stroke="#D4AF37" stroke-width="1.5" />
              <text x="200" y="383" text-anchor="middle" font-size="15" fill="#9C7A1E">S</text>
            </g>
            <g>
              <circle cx="22" cy="200" r="15" fill="#FCF7EA" stroke="#D4AF37" stroke-width="1.5" />
              <text x="22" y="205" text-anchor="middle" font-size="15" fill="#9C7A1E">W</text>
            </g>
          </g>

          <!-- Center jewel / pivot -->
          <circle id="jewel" cx="200" cy="200" r="15" fill="url(#jewelGrad)"
                  stroke="#9C7A1E" stroke-width="1" />
          <circle cx="195" cy="195" r="4" fill="#FFFDF2" opacity="0.85" />
        </svg>
      </div>

      <!-- Wordmark -->
      <h1 class="wordmark">APOLLO</h1>
    </section>

    <!-- ============ CHAT PANEL (top-left) ============ -->
    <section class="chat-panel" id="chatPanel" aria-label="Chat with Apollo">
      <header class="chat-header">
        <span class="chat-title">Chat</span>
        <div class="chat-header-actions">
          <button class="icon-btn" id="clearBtn" title="Clear chat" aria-label="Clear chat">
            <svg viewBox="0 0 24 24" width="16" height="16"><path d="M5 7h14M10 7V5h4v2M7 7l1 13h8l1-13" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button class="icon-btn" id="collapseBtn" title="Hide chat" aria-label="Hide chat">
            <svg viewBox="0 0 24 24" width="18" height="18"><path d="M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </button>
        </div>
      </header>

      <div class="messages" id="messages" aria-live="polite"></div>

      <!-- A small inline notice area (e.g. mic permission denied) -->
      <div class="notice" id="notice" hidden></div>

      <div class="input-row">
        <button class="icon-btn mic" id="micBtn" title="Speak (voice to text)" aria-label="Voice to text">
          <svg viewBox="0 0 24 24" width="20" height="20"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Z" fill="currentColor"/><path d="M6 11a6 6 0 0 0 12 0M12 18v3" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
        </button>
        <input class="text-input" id="input" type="text"
               placeholder="Message Apollo…" autocomplete="off" />
        <button class="icon-btn mute" id="muteBtn" title="Mute Apollo's voice" aria-label="Mute voice">
          <!-- icon swapped by app.js depending on mute state -->
        </button>
        <button class="icon-btn send" id="sendBtn" title="Send" aria-label="Send">
          <svg viewBox="0 0 24 24" width="20" height="20"><path d="M4 12l16-8-6 8 6 8-16-8Z" fill="currentColor"/></svg>
        </button>
      </div>
    </section>

    <!-- Floating button to restore the chat after it's collapsed -->
    <button class="chat-restore" id="chatRestore" title="Open chat" aria-label="Open chat" hidden>
      <svg viewBox="0 0 24 24" width="22" height="22"><path d="M4 5h16v11H8l-4 4V5Z" fill="currentColor"/></svg>
    </button>

  </main>

  <script src="/static/app.js"></script>
</body>
</html>
